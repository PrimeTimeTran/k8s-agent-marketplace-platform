apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-control-plane
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-control-plane
  namespace: agent-platform
rules:
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['create', 'get', 'list', 'delete']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-control-plane
  namespace: agent-platform
subjects:
  - kind: ServiceAccount
    name: infra-control-plane
roleRef:
  kind: Role
  name: infra-control-plane
  apiGroup: rbac.authorization.k8s.io
