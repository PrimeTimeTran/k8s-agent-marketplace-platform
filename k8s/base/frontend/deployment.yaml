apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: NEXT_PUBLIC_PRODUCT_API
              value: 'http://product-control-plane:3000'
