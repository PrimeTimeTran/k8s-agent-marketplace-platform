apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-control-plane
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-control-plane
  template:
    metadata:
      labels:
        app: product-control-plane
    spec:
      containers:
        - name: product-control-plane
          image: product-control-plane:dev
          command: ['npm', 'run', 'dev']
          ports:
            - containerPort: 3000
