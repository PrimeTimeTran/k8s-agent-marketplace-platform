apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: agent-runtime:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command: ['uvicorn']
          args:
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - '8000'
            - --reload
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-env
                  key: APP_ENV
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 10
