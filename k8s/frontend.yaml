apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_PRODUCT_API
              value: 'http://product-control-plane:3000'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agent-platform
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
