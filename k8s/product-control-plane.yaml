apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-control-plane
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-control-plane
  template:
    metadata:
      labels:
        app: product-control-plane
    spec:
      containers:
        - name: product-control-plane
          image: product-control-plane
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-control-plane
  namespace: agent-platform
spec:
  selector:
    app: product-control-plane
  ports:
    - port: 3000
      targetPort: 3001
