apiVersion: batch/v1
kind: Job
metadata:
  name: agent-job
  namespace: agent-platform
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 30
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: agent-job:dev
          imagePullPolicy: IfNotPresent
          env:
            # - name: EXECUTION_ID
            #   value: '<execution-id>'
            # - name: CONTROL_PLANE_URL
            #   value: 'http://infra-control-plane:3000'
