apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: agent-runtime
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command: ['uvicorn']
          args:
            - 'main:app'
            - '--host'
            - '0.0.0.0'
            - '--port'
            - '8000'
            - --log-level
            - info
            # Useful for hot reloading but causes startup issues
            # - '--reload'

          # “Has this thing finished booting yet?”
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 60
            periodSeconds: 5
          # “Can I send traffic to it right now?”
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          # “Is it broken and needs to be restarted?”
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: agent-platform
spec:
  selector:
    app: agent-runtime
  ports:
    - port: 8000
      targetPort: 8000
