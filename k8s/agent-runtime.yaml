apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: agent-runtime:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command: ['uvicorn']
          args:
            - 'main:app'
            - '--host'
            - '0.0.0.0'
            - '--port'
            - '8000'
            - '--reload'

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: agent-platform
spec:
  selector:
    app: agent-runtime
  ports:
    - port: 8000
      targetPort: 8000
