apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-control-plane
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-control-plane
  namespace: agent-platform
rules:
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['create', 'get', 'list', 'delete']
  - apiGroups: ['']
    resources: ['pods', 'pods/log']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-control-plane
  namespace: agent-platform
subjects:
  - kind: ServiceAccount
    name: infra-control-plane
roleRef:
  kind: Role
  name: infra-control-plane
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-control-plane
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-control-plane
  template:
    metadata:
      labels:
        app: infra-control-plane
    spec:
      serviceAccountName: infra-control-plane
      containers:
        - name: infra-control-plane
          image: infra-control-plane
          imagePullPolicy: IfNotPresent
          command: ['npm', 'run', 'dev']
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: infra-control-plane
  namespace: agent-platform
spec:
  selector:
    app: infra-control-plane
  ports:
    - port: 3000
