apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-control-plane
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-control-plane
  template:
    metadata:
      labels:
        app: infra-control-plane
    spec:
      containers:
        - name: infra-control-plane
          image: infra-control-plane:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: infra-control-plane
  namespace: agent-platform
spec:
  selector:
    app: infra-control-plane
  ports:
    - port: 3000
