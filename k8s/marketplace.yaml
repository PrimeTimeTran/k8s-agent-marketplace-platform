apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: agent-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: marketplace
  template:
    metadata:
      labels:
        app: marketplace
    spec:
      containers:
        - name: marketplace
          image: marketplace
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              # Note:
              # Uncomment for prod deployment
              # Breaks localhost dev(skaffold dev)
              # hostPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: PRODUCT_CONTROL_PLANE_URL
              value: 'http://product-control-plane:3000'
            # These 5 values are for hot module reloading
            - name: WATCHPACK_POLLING
              value: 'true'
            - name: WATCHPACK_POLLING_INTERVAL
              value: '100'
            - name: CHOKIDAR_USEPOLLING
              value: 'true'
            - name: CHOKIDAR_INTERVAL
              value: '100'
            - name: WATCHPACK_FORCE_POLLING
              value: 'true'

---
apiVersion: v1
kind: Service
metadata:
  name: marketplace
  namespace: agent-platform
spec:
  type: NodePort
  selector:
    app: marketplace
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
