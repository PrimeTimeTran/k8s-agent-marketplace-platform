apiVersion: skaffold/v4beta6
kind: Config

build:
  local:
    push: false
  artifacts:
    - image: marketplace
      context: marketplace
      docker:
        dockerfile: Dockerfile.dev
      sync:
        infer:
          - '**/*'

    - image: product-control-plane
      context: product-control-plane
      sync:
        infer:
          - '**/*'

    - image: infra-control-plane
      context: infra-control-plane
      sync:
        infer:
          - '**/*'

    - image: agent-job
      context: agent-job

    - image: agent-base
      context: execution
      docker:
        dockerfile: Dockerfile.base

manifests:
  rawYaml:
    - k8s/namespaces.yaml
    - k8s/marketplace.yaml
    - k8s/product-control-plane.yaml
    - k8s/infra-control-plane.yaml
    - k8s/agent-job.yaml
