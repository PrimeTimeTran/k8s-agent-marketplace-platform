apiVersion: marketplace.yourcompany.dev/v1
kind: Agent
metadata:
  name: hello-agent
spec:
  displayName: Hello Agent
  version: '1.0.0'
  runtime: python
  image: hello-agent:latest
  entrypoint: main.py
  health:
    path: /health
  inputs:
    - name: prompt
      type: string
  outputs:
    - name: response
      type: string
